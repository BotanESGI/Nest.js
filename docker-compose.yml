services:
  db:
    image: postgres:16-alpine
    container_name: tournaments-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tournaments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:4
    container_name: tournaments-adminer-dev
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tournaments-api-dev
    depends_on:
      - db
    env_file:
      - .env.example
    environment:
      NODE_ENV: development
      DB_HOST: db
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  postgres_data:
