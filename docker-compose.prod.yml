services:
  db:
    image: postgres:16-alpine
    container_name: tournaments-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tournaments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tournaments-api-prod
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      DB_HOST: db
    ports:
      - "3000:3000"

volumes:
  postgres_data_prod:
